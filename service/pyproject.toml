[project]
name = "parceldocs-service"
version = "0.1.0"
description = "ParcelDocs: building permits and approved plans for parcels in Bnei Brak"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    # AES-encrypted plan PDFs (owner password only) need cryptography to open.
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pypdf>=5",
    "pyyaml>=6.0",
    "shapely>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
parceldocs = "app.cli:main"
parceldocs-service = "app.main:main"
parceldocs-mavat = "app.mavat_assist:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# Hebrew text legitimately contains characters ruff flags as ambiguous.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
