# ParcelDocs service configuration.
# Relative paths are resolved against this file's directory.

output_dir: ../output
cache_db: ../output/.cache/downloads.sqlite

user_agent: "ParcelDocs/0.1 (internal surveying-office tool; +https://github.com/mmy666-eng/ParcelDocs)"
requests_per_second: 1.0
timeout_seconds: 60
retries: 4

# Slower pace for hosts that answer 429 at one request per second (docs/sources.md §5.1).
host_min_interval_seconds:
  handasi.complot.co.il: 5.0
# Maximum requests per run to a host; the run reports what it could not check.
# Complot: 60 (user's decision, 2026-10-29); 6123/443 needed 27.
host_max_requests_per_run:
  handasi.complot.co.il: 60
# Hosts where a 429 stops all further requests in the run instead of waiting and retrying.
fail_fast_429_hosts:
  - handasi.complot.co.il
# Wait after a 429 without Retry-After; multiplied by the attempt number.
rate_limited_wait_seconds: 60

# Hosts that only offer legacy TLS ciphers (AES128-SHA); see docs/sources.md §3א.
legacy_tls_hosts:
  - ags.iplan.gov.il

# Negative buffer applied to the query polygon before intersecting with the cadastre (PRD §4.1).
parcel_buffer_m: -0.5

# Complot plan ids (the n= of GetTabaFile) for city-wide Bnei Brak plans that are always
# included, even when they do not come up for the parcel (PRD §4.3).
citywide_plans: []

# Sources the tool must not contact (bnei_brak, rmi). bnei_brak (Complot) blocked our IP
# with HTTP 429 on 2026-10-28; enabled again for the one approved check on 2026-10-29.
disabled_sources: []

# Office library of plan documents: <city>/<plan number>/ and ארציות/<plan number>/,
# each with plan.json (PRD §4.3). Searched before any source and filled after every
# download; every user writes to it. On the office server (Y:\ראשי\עבודות\תב''עות),
# written as a UNC path because Y: may not be connected yet when the service starts at
# logon (user's decision, 2026-10-29). Remove the line to turn the library off.
plans_library: "//server/מסמכים משותפים/ראשי/עבודות/תב''עות"
# Used while the share cannot be reached, and synced to it when it answers again.
plans_library_local: ../output/.cache/library_local
# This computer's index of the library (SQLite, never on the share); safe to delete.
library_index: ../output/.cache/library_index.sqlite
# A plan without instructions and a map in the library is listed again in Complot
# (GetTabaFile) only after this many days.
library_recheck_days: 30
# A plan whose boundary covers at least this share of the municipality is city-wide.
citywide_min_share: 0.5

# Files downloaded by hand from mavat are picked up here (default: ~/Downloads).
# downloads_dir: C:/Users/<user>/Downloads
# Filed downloads move to a "ParcelDocs_תויק" subfolder; false leaves them in place.
move_filed_downloads: true

# Endpoints verified in docs/sources.md.
sources:
  govmap_wfs: https://open.govmap.gov.il/geoserver/opendata/wfs
  iplan_plans_layer: https://ags.iplan.gov.il/arcgisiplan/rest/services/PlanningPublic/Xplan/MapServer/1
  complot_base: https://handasi.complot.co.il/magicscripts/mgrqispi.dll
  complot_site_id: 75
  complot_ws: https://handasi.complot.co.il/wsComplotPublicData/ComplotPublicData.asmx
  # Israel Land Authority plan search (§3ה): plans by parcel or number, with PDFs.
  rmi_api: https://apps.land.gov.il/TabaSearch/api
  rmi_files: https://apps.land.gov.il
